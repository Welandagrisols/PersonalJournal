kind = "mobile"
previewPath = "/"
title = "Journal App"
version = "1.0.0"
id = "artifacts/journal-app"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21114

[services.development]
run = "pnpm --filter @workspace/journal-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/journal-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/journal-app", "run", "serve" ]

[services.env]
PORT = "21114"
BASE_PATH = "/"
